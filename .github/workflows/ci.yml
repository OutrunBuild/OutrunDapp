# Minimal CI: a precursor subset of the scope ruled in docs/architecture.md §12 (typecheck/lint/format/full vitest,
# with the fixture-boundary and design-raw-value/contrast/architecture-compliance checkers bundled in vitest) + ABI/manifest integrity check
# (wired in the stage 4 freeze round); production build and Playwright follow with the full §12 compliance round. Gate policy stays consistent with .githooks/pre-push.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      # The §12 machine contract pins Corepack 0.34.5; ubuntu-latest's Node 24.20.0 ships 0.35.0 —
      # align the runner to the contract version; re-pinning the contract itself (to 0.35.0) waits for the frozen-chain re-sign round
      - run: npm install -g corepack@0.34.5
      - run: node scripts/check-runtime.mjs --strict
      # docs/design frozen-manifest working-tree integrity (pure node, no dependencies; wired 2026-10-09 to prevent silent drift —
      # the 147 stale manifest entries left after the v0-input tree deletion are the cautionary tale)
      - run: node scripts/check-design-freeze.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # ABI/manifest integrity (schema/SHA256/EIP-55/cross-consistency/plaintext key scan, offline, no network;
      # on-chain live codehash verification = release certification (stage-04 step 9/12), not in CI)
      - run: pnpm node scripts/check-abi-manifest.mjs
