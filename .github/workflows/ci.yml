# 最小 CI：docs/architecture.md §12 裁定范围的先导子集（typecheck/lint/format/vitest 全量，
# vitest 内含 fixture-boundary 与设计裸值/对比度/架构合规三 checker）+ ABI/manifest 完整性校验
# （阶段 4 冻结轮接线）；生产构建、Playwright 随完整 §12 合规轮补齐。闸门口径与 .githooks/pre-push 保持一致。
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      # §12 机器契约钉 Corepack 0.34.5；ubuntu-latest 的 Node 24.20.0 自带 0.35.0——
      # runner 侧对齐契约版本，契约本身的重钉（0.35.0 化）留待冻结链重签轮
      - run: npm install -g corepack@0.34.5
      - run: node scripts/check-runtime.mjs --strict
      # docs/design 冻结清单工作树完整性（纯 node、无依赖；2026-10-09 接线防静默漂移——
      # v0-input 树删除后 manifest 失修 147 条即前车之鉴）
      - run: node scripts/check-design-freeze.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # ABI/manifest 完整性（schema/SHA256/EIP-55/交叉一致/明文 key 扫描，离线不触网；
      # 链上活体 codehash 复核=发布认证（stage-04 步骤 9/12），不进 CI）
      - run: pnpm node scripts/check-abi-manifest.mjs
