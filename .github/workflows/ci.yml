# 最小 CI：docs/architecture.md §12 裁定范围的先导子集（typecheck/lint/format/vitest 全量，
# vitest 内含 fixture-boundary 与设计裸值/对比度/架构合规三 checker）；生产构建、Playwright、
# ABI/manifest 校验随完整 §12 合规轮补齐。闸门口径与 .githooks/pre-push 保持一致。
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      # §12 机器契约钉 Corepack 0.34.5；ubuntu-latest 的 Node 24.20.0 自带 0.35.0——
      # runner 侧对齐契约版本，契约本身的重钉（0.35.0 化）留待冻结链重签轮
      - run: npm install -g corepack@0.34.5
      - run: node scripts/check-runtime.mjs --strict
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # 存量 lint 债清偿期：11 处（unused vars/失效 @next 指令）集中在 8 个并行在途文件
      # （create-form/app-shell/home-page/portfolio-dialogs/vault-actions/verse-tab-panels/
      # check-fixture-boundary/check-architecture-compliance），随在途轮落地——pre-commit 的
      # staged eslint 钩子会强制其入库前清偿；该批归零后删除 continue-on-error 恢复阻断。
      - run: pnpm lint
        continue-on-error: true
      - run: pnpm format:check
      - run: pnpm test
