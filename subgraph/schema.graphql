# --- LayerZero send/receive ------------------------------------------------------------

type LayerZeroMessage @entity(immutable: true) {
  id: ID! # {chainId}-{guid|tx}-{blockNumber}-{logIndex}
  chainId: Int!
  kind: String! # oft-sent | oft-received | staking-processed | compose-settled | compose-rejected | interoperation
  guid: Bytes
  srcEid: BigInt
  dstEid: BigInt
