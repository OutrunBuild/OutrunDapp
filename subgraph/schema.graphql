# Outrun DApp event-indexing schema (architecture.md §9.2).
# Hard rule: EVERY entity primary key embeds the originating chainId ("{chainId}-<natural key>"),
# and every entity also carries an explicit chainId field for filtering. Cross-chain address-only
# keys are forbidden. Event shapes come from the frozen ABI set contracts/abi/v1-rc (frozen-commit
# exports); the UniswapV4 PoolManager Swap fragment is the v4-core standard event (verified against
# v4-core/src/interfaces/IPoolManager.sol).

# --- Verse registration / lifecycle / listing -----------------------------------

type Verse @entity(immutable: false) {
  id: ID! # {chainId}-{verseId}
  chainId: Int!
  verseId: BigInt!
  name: String!
  symbol: String!
  uri: String
  description: String
  uAsset: Bytes!
  stage: String! # genesis|refund|locked|unlocked (updated on ChangeStage)
  flashGenesis: Boolean!
  memecoin: Bytes
  pol: Bytes
  yieldVault: Bytes
  governor: Bytes
  incentivizer: Bytes
  endTime: BigInt!
  unlockTime: BigInt!
  omnichainIds: [BigInt!]!
  communities: [String!]!
  registeredAtBlock: BigInt!
  registeredAtTimestamp: BigInt!
  registeredTx: Bytes!
}

type VerseStageChange @entity(immutable: true) {
  id: ID! # {chainId}-{verseId}-{blockNumber}-{logIndex}
  chainId: Int!
  verseId: BigInt!
  stage: String!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  tx: Bytes!
}

type SymbolRegistration @entity(immutable: true) {
  id: ID! # {chainId}-{uniqueId} (registration hub chain only)
  chainId: Int!
  uniqueId: BigInt!
  name: String!
  symbol: String!
  uri: String
  description: String
  communities: [String!]!
  durationDays: BigInt!
  uAsset: Bytes!
  omnichainIds: [BigInt!]!
  blockTimestamp: BigInt!
  tx: Bytes!
}

# --- Genesis / Preorder / refund / claim / participation history ------------------

type GenesisParticipation @entity(immutable: true) {
  id: ID! # {chainId}-{verseId}-{blockNumber}-{logIndex}
  chainId: Int!
  verseId: BigInt!
  payer: Bytes!
  depositer: Bytes!
  amount: BigInt!
  blockTimestamp: BigInt!
  tx: Bytes!
}

type PreorderParticipation @entity(immutable: true) {
  id: ID! # {chainId}-{verseId}-{blockNumber}-{logIndex}
  chainId: Int!
  verseId: BigInt!
  caller: Bytes!
  user: Bytes!
  amountInUAsset: BigInt!
  blockTimestamp: BigInt!
  tx: Bytes!
}

type LeveragedGenesisParticipation @entity(immutable: true) {
  id: ID! # {chainId}-{verseId}-{blockNumber}-{logIndex}
  chainId: Int!
  verseId: BigInt!
  kind: String! # direct (interest) | credit
  payer: Bytes!
  user: Bytes!
  amount: BigInt! # interestAmount (direct) or creditAmount (credit)
  blockTimestamp: BigInt!
  tx: Bytes!
}

type ParticipationRefund @entity(immutable: true) {
  id: ID! # {chainId}-{verseId}-{blockNumber}-{logIndex}
  chainId: Int!
  verseId: BigInt!
  kind: String! # genesis | preorder | leveraged-credit
  receiver: Bytes!
  amount: BigInt!
  blockTimestamp: BigInt!
  tx: Bytes!
}

type ParticipationClaim @entity(immutable: true) {
  id: ID! # {chainId}-{verseId}-{blockNumber}-{logIndex}
  chainId: Int!
  verseId: BigInt!
  kind: String! # normal-fees | normal-yt | preorder-memecoin | leveraged-yt | residual | pol-split | pol-merge | redeem-pt | redeem-yt
  receiver: Bytes!
  uAssetAmount: BigInt
  ptAmount: BigInt
  memecoinAmount: BigInt
  polAmount: BigInt
  ytAmount: BigInt
  blockTimestamp: BigInt!
  tx: Bytes!
}

# --- Pools / swap / liquidity / fees / referral / YT flash swap history ------------

type Pool @entity(immutable: false) {
  id: ID! # {chainId}-{poolId}
  chainId: Int!
  poolId: Bytes!
  currency0: Bytes!
  currency1: Bytes!
  liquidityToken: Bytes!
  startPriceX96: BigInt
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
}

type PoolSwap @entity(immutable: true) {
  id: ID! # {chainId}-{poolId}-{blockNumber}-{logIndex}
  chainId: Int!
  poolId: Bytes!
  sender: Bytes!
  amount0: BigInt!
  amount1: BigInt!
  sqrtPriceX96: BigInt!
  liquidity: BigInt!
  tick: BigInt!
  fee: BigInt!
  blockTimestamp: BigInt!
  tx: Bytes!
}

type PoolLiquidity @entity(immutable: true) {
  id: ID! # {chainId}-{poolId}-{blockNumber}-{logIndex}
  chainId: Int!
  poolId: Bytes!
  kind: String! # add | remove
  provider: Bytes!
  to: Bytes
  liquidity: BigInt!
  amount0: BigInt!
  amount1: BigInt!
  blockTimestamp: BigInt!
  tx: Bytes!
}

type PoolFee @entity(immutable: true) {
  id: ID! # {chainId}-{poolId}-{blockNumber}-{logIndex}
  chainId: Int!
  poolId: Bytes!
  kind: String! # lp | protocol | claimed
  user: Bytes # claimed-to / n/a for lp|protocol
  currency: Bytes!
  amount: BigInt!
  feePerShare: BigInt
  treasury: Bytes
  pairedCurrency: Bytes
  pairedAmount: BigInt
  blockTimestamp: BigInt!
  tx: Bytes!
}

type ReferralRebate @entity(immutable: true) {
  id: ID! # {chainId}-{blockNumber}-{logIndex}
  chainId: Int!
  kind: String! # accrued | claimed
  referrer: Bytes!
  recipient: Bytes # claim destination (claimed only)
  currency: Bytes!
  amount: BigInt!
  blockTimestamp: BigInt!
  tx: Bytes!
}

type YTFlashSwap @entity(immutable: true) {
  id: ID! # {chainId}-{verseId}-{blockNumber}-{logIndex}
  chainId: Int!
  verseId: BigInt!
  direction: String! # pol-for-yt | yt-for-pol
  payer: Bytes!
