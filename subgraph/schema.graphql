  account: Bytes
  amountSentLD: BigInt
  amountReceivedLD: BigInt
  amount: BigInt
  remainder: BigInt
  blockTimestamp: BigInt!
  tx: Bytes!
}

# --- Dynamic contract activity (MemecoinYieldVault template) --------------------------

type VaultActivity @entity(immutable: true) {
